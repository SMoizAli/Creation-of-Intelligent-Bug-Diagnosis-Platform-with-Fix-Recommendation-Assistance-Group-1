services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-smart-bug-analyzer-and-fix-advisor-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../uploads:/app/uploads
      - ../chroma_db:/app/chroma_db
      - ../logs:/app/logs
      - ../datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-smart-bug-analyzer-and-fix-advisor-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  upload_data:
